version: '3.8'

services:
  go-app:
    build:
      context: ./go-app
    ports:
      - '8085:8085'

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    volumes:
      - ./otel-collector-config.yaml:/etc/otel/config.yaml
    command: ['--config=/etc/otel/config.yaml']
    ports:
      - '7317:7317' # Custom OTLP gRPC
      - '7318:7318' # Custom OTLP HTTP
    depends_on:
      - go-app
      - mimir

  mimir:
    image: grafana/mimir:latest
    command: ['-config.file=/etc/mimir/config.yaml']
    volumes:
      - ./mimir-config.yaml:/etc/mimir/config.yaml
      - mimir-data:/data
    ports:
      - '9009:9009' # HTTP API and UI

  grafana:
    image: grafana/grafana:9.5.1 # Specify version explicitly
    ports:
      - '3000:3000'
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin # Give anonymous users admin rights
      - GF_USERS_DEFAULT_THEME=light
      - GF_FEATURE_TOGGLES_ENABLE=exploreMixedDatasources # Enable specific features
      - GF_EXPLORE_ENABLED=true
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      # Add custom.ini to force enable Explore
      - ./grafana/custom.ini:/etc/grafana/custom.ini
    depends_on:
      - mimir

  tempo:
    image: grafana/tempo:latest
    command: ['-config.file=/etc/tempo.yaml']
    volumes:
      - ./tempo-config.yaml:/etc/tempo.yaml
      - tempo-data:/tmp/tempo
    ports:
      - '9411:9411' # OTLP gRPC
      - '9412:9412' # OTLP HTTP
      - '3200:3200' # Tempo API
    depends_on:
      - otel-collector

volumes:
  tempo-data:
  mimir-data:
