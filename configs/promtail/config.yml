server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: go_app_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: go-app
          app: observability-demo
          __path__: /var/log/app/*.log
    
    # Add pipeline stages to extract labels from JSON logs
    pipeline_stages:
      - json:
          expressions:
            service: service
            level: level
      
      # Set extracted values as labels
      - labels:
          service:
          level: